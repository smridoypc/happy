workflows:
  happy-ios-simulator:
    name: Happy iOS - Simulator Build (No Apple Developer Account Required)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      vars:
        HAPPY_RELEASE_WITHOUT_CALL_AGENT: "1"

    scripts:
      - name: Install XcodeGen
        script: |
          which xcodegen || brew install xcodegen

      - name: Generate Xcode Project
        script: |
          cd packages/happy-ios
          xcodegen generate

      - name: Resolve SPM Dependencies
        script: |
          cd packages/happy-ios
          xcodebuild -resolvePackageDependencies -project Happy.xcodeproj -scheme Happy

      - name: Build for iOS Simulator
        script: |
          cd packages/happy-ios
          set -o pipefail
          xcodebuild build \
            -project Happy.xcodeproj \
            -scheme Happy \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild.log || {
              echo "==================== BUILD ERROR SUMMARY ===================="
              grep -E "(: error:|fatal error:)" /tmp/xcodebuild.log | head -n 30
              echo "============================================================="
              exit 1
            }

    artifacts:
      - packages/happy-ios/build/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild.log

  happy-ios-release:
    name: Happy iOS - Release IPA (For TestFlight / Physical Devices)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      vars:
        HAPPY_RELEASE_WITHOUT_CALL_AGENT: "1"

    scripts:
      - name: Install XcodeGen
        script: |
          which xcodegen || brew install xcodegen

      - name: Generate Xcode Project
        script: |
          cd packages/happy-ios
          xcodegen generate

      - name: Resolve SPM Dependencies
        script: |
          cd packages/happy-ios
          xcodebuild -resolvePackageDependencies -project Happy.xcodeproj -scheme Happy

      - name: Build & Package App
        script: |
          cd packages/happy-ios
          set -o pipefail
          xcodebuild archive \
            -project Happy.xcodeproj \
            -scheme Happy \
            -configuration Release \
            -archivePath build/Happy.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild.log || {
              echo "==================== BUILD ERROR SUMMARY ===================="
              grep -E "(: error:|fatal error:)" /tmp/xcodebuild.log | head -n 30
              echo "============================================================="
              exit 1
            }

    artifacts:
      - packages/happy-ios/build/Happy.xcarchive
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log
